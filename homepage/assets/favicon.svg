<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ECHO">
  <defs>
    <linearGradient id="favicon-ring" x1="13" y1="10" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.5" stop-color="#eaf2ff" />
      <stop offset="1" stop-color="#76a6ff" />
    </linearGradient>
    <filter id="favicon-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feFlood flood-color="#71a4ff" flood-opacity="0.62" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="halo" />
      <feMerge><feMergeNode in="halo" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#03060c" stroke="#1a2232" />
  <g filter="url(#favicon-glow)">
    <path
      d="M 42.7 17.7 A 20 20 0 1 0 42.7 46.3"
      fill="none"
      stroke="url(#favicon-ring)"
      stroke-width="6.4"
      stroke-linecap="round"
    />
    <circle cx="49.1" cy="32" r="3.55" fill="url(#favicon-ring)" />
  </g>
</svg>
