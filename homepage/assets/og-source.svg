<!-- 画布为方形 1200×1200，实际图面是垂直居中的 1200×630 区域（y=0..630）。
     qlmanage 按高度适配，方形画布可避免缩放；渲染后用 sips 裁中间 630 行即得成品。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 -285 1200 1200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="62%">
      <stop offset="0" stop-color="#0b1230" />
      <stop offset="0.55" stop-color="#050818" />
      <stop offset="1" stop-color="#020308" />
    </radialGradient>
    <linearGradient id="ring" x1="360" y1="150" x2="840" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="0.5" stop-color="#cfe0ff" stop-opacity="0.7" />
      <stop offset="1" stop-color="#6f9cff" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="word" x1="150" y1="250" x2="1050" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.7" stop-color="#eef3ff" />
      <stop offset="1" stop-color="#b7ccff" />
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.35" stop-color="#cfe0ff" />
      <stop offset="1" stop-color="#6f9cff" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b" />
      <feFlood flood-color="#78a8ff" flood-opacity="0.5" result="c" />
      <feComposite in="c" in2="b" operator="in" result="h" />
      <feMerge><feMergeNode in="h" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <g fill="#ffffff">
    <circle cx="120" cy="90" r="1.5" opacity="0.5" /><circle cx="300" cy="60" r="1.1" opacity="0.35" />
    <circle cx="520" cy="110" r="1.3" opacity="0.4" /><circle cx="780" cy="70" r="1" opacity="0.3" />
    <circle cx="980" cy="130" r="1.6" opacity="0.45" /><circle cx="1120" cy="80" r="1.1" opacity="0.3" />
    <circle cx="80" cy="300" r="1.2" opacity="0.35" /><circle cx="1150" cy="330" r="1.4" opacity="0.4" />
    <circle cx="160" cy="520" r="1.3" opacity="0.38" /><circle cx="400" cy="570" r="1" opacity="0.28" />
    <circle cx="700" cy="545" r="1.5" opacity="0.42" /><circle cx="900" cy="590" r="1.1" opacity="0.3" />
    <circle cx="1060" cy="500" r="1.2" opacity="0.34" /><circle cx="240" cy="200" r="1" opacity="0.26" />
    <circle cx="620" cy="250" r="1.1" opacity="0.3" /><circle cx="860" cy="420" r="1.3" opacity="0.36" />
  </g>

  <g transform="translate(600 315)">
    <circle r="248" fill="none" stroke="#4c6bb0" stroke-width="1" opacity="0.16" />
    <circle r="196" fill="none" stroke="#4c6bb0" stroke-width="1" opacity="0.12" />
    <g filter="url(#glow)">
      <path d="M 176.4 -160.8 A 238 238 0 1 0 176.4 160.8" fill="none" stroke="url(#ring)" stroke-width="3.4" stroke-linecap="round" />
      <circle cx="228" cy="0" r="9.5" fill="#ffffff" />
    </g>
    <circle cx="228" cy="0" r="30" fill="url(#core)" opacity="0.55" />
  </g>

  <g text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="600" y="196" fill="#8fb2ff" font-size="19" font-weight="500" letter-spacing="7.5" opacity="0.92">ECHO AGE · SIGNAL 2147</text>
    <text x="600" y="316" fill="url(#word)" font-size="97" font-weight="200" letter-spacing="7">THE ECHO AGE</text>
    <text x="600" y="398" fill="url(#word)" font-size="61" font-weight="300" letter-spacing="12" opacity="0.95">BEGINS HERE</text>
    <text x="600" y="470" fill="#c3d2f2" font-size="27" font-weight="400" letter-spacing="5">回响纪元，由此开始</text>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3.4" fill="#64769c">
    <text x="64" y="576">MEMORY SEA // ONLINE</text>
    <text x="1136" y="576" text-anchor="end">WHITE HARBOR // 37.46N</text>
  </g>
</svg>
