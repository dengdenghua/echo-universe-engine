<!-- Open Graph cover, 1200×630. Rendered with sharp to og-cover.jpg. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="ground" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#101216" />
      <stop offset="1" stop-color="#090A0C" />
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#EEF1F4" />
    </pattern>
    <radialGradient id="grid-fade" cx="50%" cy="46%" r="70%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.1" />
    </radialGradient>
    <mask id="grid-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="630">
      <rect width="1200" height="630" fill="url(#grid-fade)" />
    </mask>
    <radialGradient id="core-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6FE3F0" stop-opacity="0.22" />
      <stop offset="0.45" stop-color="#6FE3F0" stop-opacity="0.07" />
      <stop offset="1" stop-color="#6FE3F0" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ground -->
  <rect width="1200" height="630" fill="url(#ground)" />

  <!-- Telemetry dot grid -->
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.1" mask="url(#grid-mask)" />

  <!-- Hairline corner ticks -->
  <g fill="none" stroke="#EEF1F4" stroke-width="1" opacity="0.12">
    <path d="M24.5 44.5v-20h20M1155.5 24.5h20v20M1175.5 585.5v20h-20M44.5 605.5h-20v-20" />
    <path d="M24.5 315.5h10M1165.5 315.5h10M600.5 24.5v8M600.5 597.5v8" />
  </g>

  <!-- Soft halo behind the Echo Core only -->
  <circle cx="385.8" cy="220" r="64" fill="url(#core-halo)" />

  <!-- Wordmark: geometry copied verbatim from echo-wordmark-snow.svg (viewBox 14 14 174 36), scaled 3.4×, centered -->
  <g transform="translate(256.6 111.2) scale(3.4)">
    <g fill="none" stroke="#EEF1F4" stroke-width="6">
      <path d="M50 17H24a7 7 0 0 0-7 7v16a7 7 0 0 0 7 7h26" />
      <path d="M93 17H67a7 7 0 0 0-7 7v16a7 7 0 0 0 7 7h26" />
      <path d="M104 14v36M137 14v36M104 32h33" />
      <rect x="152" y="17" width="33" height="30" rx="7" />
    </g>
    <circle cx="38" cy="32" r="5" fill="#6FE3F0" />
  </g>

  <!-- Taglines -->
  <text x="613" y="372" text-anchor="middle" fill="#EEF1F4" font-size="38" font-weight="400"
    font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif">记忆不灭，文明回响。</text>
  <text x="600" y="420" text-anchor="middle" fill="#9AA3AE" font-size="18" font-weight="400" letter-spacing="5.4"
    font-family="'Segoe UI', Arial, sans-serif">EVERY LIFE LEAVES AN ECHO.</text>

  <!-- Telemetry labels -->
  <g font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="14" letter-spacing="1.7">
    <text x="64" y="578" fill="#9AA3AE">UNIVERSE.ECHO-AGE.COM</text>
    <text x="1137.7" y="578" text-anchor="end" fill="#6B7380">ECHO AGE · 2147</text>
  </g>
</svg>
