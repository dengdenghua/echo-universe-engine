<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 264 64" role="img" aria-labelledby="echo-logo-title echo-logo-desc">
  <title id="echo-logo-title">ECHO</title>
  <desc id="echo-logo-desc">ECHO Age echo ring brand mark</desc>
  <defs>
    <linearGradient id="echo-ring" x1="13" y1="9" x2="53" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.48" stop-color="#eef4ff" />
      <stop offset="0.78" stop-color="#9fc6ff" />
      <stop offset="1" stop-color="#6f9cff" />
    </linearGradient>
    <linearGradient id="echo-word" x1="72" y1="20" x2="226" y2="43" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.72" stop-color="#eef3ff" />
      <stop offset="1" stop-color="#b7ccff" />
    </linearGradient>
    <filter id="echo-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feFlood flood-color="#78a8ff" flood-opacity="0.52" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="halo" />
      <feMerge>
        <feMergeNode in="halo" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#echo-glow)">
    <path
      d="M 45.35 15.62 A 22 22 0 1 0 45.35 48.38"
      fill="none"
      stroke="url(#echo-ring)"
      stroke-width="6.8"
      stroke-linecap="round"
    />
    <circle cx="52.6" cy="32" r="3.85" fill="url(#echo-ring)" />
  </g>
  <text
    x="76"
    y="31.5"
    fill="url(#echo-word)"
    font-family="Inter, SF Pro Display, Helvetica Neue, Arial, sans-serif"
    font-size="18"
    font-weight="420"
    letter-spacing="8"
  >ECHO</text>
  <text
    x="77"
    y="49"
    fill="#91a0bc"
    font-family="Inter, SF Pro Text, Helvetica Neue, Arial, sans-serif"
    font-size="7.5"
    font-weight="440"
    letter-spacing="4.8"
  >ECHO AGE</text>
</svg>
