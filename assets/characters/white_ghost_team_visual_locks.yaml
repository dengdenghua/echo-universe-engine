    hair: silver-white, clean layered cut, luminous but not glowing like magic
    face: apparent 18, calm expression, controlled sadness, pure features
    eyes: pale gray or light cyan; pure white only during ECHO deep access scenes
    accent_color: pale cyan and soft pink
