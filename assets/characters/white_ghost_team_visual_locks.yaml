style_authority: bible/visual_system_v1.md
asset_index: assets/characters/octopus_visual_asset_index.yaml
team: White Ghost Team
status: octopus_reference_assets_copied
global_constraints:
  palette: snow white industrial uniforms, graphite black modular straps, restrained character accent color
  world_feel: clean, surgical, monitored, post-AI, emotionally haunted
  required_elements:
    - Echo Core interface marker
    - white tactical silhouette
    - black modular strap or compression detail
    - biotech or neural interface element
  banned_elements:
    - fantasy armor
    - supernatural aura
    - dirty neon street punk default
    - horns
    - wings
    - wizard robe
    - medieval weapons
    - random outfit redesign between panels
generation_policy:
  source_of_truth:
    - use copied Octopus references in assets/characters/*/octopus_refs before any fresh generation
    - never generate recurring comic panels from text prompts alone
    - every new image must preserve face, hair, silhouette, outfit language, and accent colors from the copied references
  first_pass:
    output_type: reference_based_character_lock_sheet
    required_views:
      - front
      - side
      - back
      - head_closeup
      - expression_sheet
    size: 1024x1536
    background: clean dark industrial background
  consistency_tools:
    - IP-Adapter face reference
    - ControlNet pose
    - ControlNet lineart
    - per-character LoRA after lock approval
    - fixed prompt prefix
    - fixed negative prompt
  approval_required_before_comic: true
