ecosystem: octopus
version: 0.1
mode: neural_universe
architecture_codex: workflows/architecture_codex.md

product_doctrine:
  category: AI-native interactive universe
  not_category: AI chatbot skin store
  north_star: "memory upload -> Ghost binding -> daily life -> relationship field -> canon review"
  mvp_loop:
    - bind Ghost
    - read current diary and focus
    - speak through octopus-agent in main chat
    - advance one daily tick
    - see visible canon-safe change
  success_criteria:
    - user_understands_premise_within_three_minutes
    - first_diary_feels_character_specific
    - first_chat_uses_exported_echo_agent_not_generic_prompting
    - daily_tick_changes_state_without_breaking_canon
    - world_brain_blocks_destructive_drift

realm_governance:
  source: data/realms.yaml
  reviewers_source: data/reviewers.yaml
  route_api: /api/realms/review-route
  hierarchy:
    - main
    - planet
    - nation
    - city
    - arc
    - instance
  impact_routing:
    personal: personal_safety_gate
    instance: instance_reviewer_required
    arc: arc_reviewer_required
    city: city_reviewer_required
    nation: nation_board_required
    planet: planet_board_required
    main: world_brain_required
  rule: "Impact radius decides reviewer group; promotion escalates through parent realms before main canon."

npc_system:
  source: data/npcs.yaml
  api_prefix: /api/npcs
  types:
    anchor: Main canon characters with protected long-term arcs.
    realm: Local characters owned by a Realm or Arc.
    utility: Functional guides, clerks, reviewers, shopkeepers, and quest givers.
    creator: Creator-submitted NPCs after local review.
  rule: "NPCs are social nodes with Realm ownership, review routes, and relationship policy; they are not generic chat skins."
  routing: "NPC actions resolve through Realm governance before they can affect shared or main canon."

identity_access:
  source: data/access_policy.yaml
  state: data/user_identities.json
  api_prefix: /api/identity
  default_registered_tier: edge_ghost
  progression:
    - edge_ghost
    - citizen
    - realm_participant
    - creator
    - realm_operator
    - canon_candidate
    - world_brain_member
  rule: "Free registered users enter from the edge with personal canon; wider impact requires subscription, Realm entitlement, creator review, or operator assignment."
  hard_boundary: "Identity tier and entitlements can expand review radius, but they never bypass reviewer approval."

visual_canon:
  source: data/skin_policy.yaml
  api_prefix: /api/skins
  layers:
    local_skin: Private projection for local device and personal canon only.
    uniform_skin: System-issued edge role appearance for low-risk shared presence.
    realm_skin: Realm-reviewed appearance visible inside one governed Realm or Arc.
    prestige_skin: Scarce, earned, or reviewed local recognition skin.
    canon_skin: Main-canon visual identity controlled by Core World Brain.
  hard_rule: "Local skins do not enter shared universe spaces directly."
  banned_claims:
    - main_character
    - anchor_relative
    - royal_bloodline
    - unique_legendary_title
    - strongest_in_world
    - perfect_beauty_canon
  routing: "Skin scope resolves through identity access, Realm entitlement, and visual canon review."

economy:
  source: data/economy_catalog.yaml
  state: data/economy_state.json
  api_prefix: /api/economy
  currency: credits
  monetized_surfaces:
    - ghost_binding
    - ghost_life_subscription
    - daily_life_ticks
    - realm_passes
    - review_queue_slots
    - creator_realm_operator_tools
  hard_rule: "Credits may buy access, continuity, priority, and tools; they never buy main canon approval."
  dormant_policy: "Inactive Ghost subscriptions put a digital life to sleep instead of deleting memory."

repositories:
  echo_universe_engine:
    role: canon_source
    default_path: /Users/dangbei/Public/octopus/echo-universe-engine
    owns:
      - bible
      - characters
      - factions
      - locations
      - timeline
      - technologies
      - relationships
      - stories
      - prompts
      - outputs
  octopus_agent:
    role: runtime_brain
    default_path: /Users/dangbei/Public/octopus/octopus-agent
    reuses:
      - agent_runtime
      - scheduler
      - knowledge_graph
      - journal
      - model_routing
      - multi_agent_execution
  octopus_mobile:
    role: embodied_gateway
    default_path: /Users/dangbei/Public/octopus/octopus-mobile
    reuses:
      - mobile_sensing
      - notifications
      - camera_or_screen_context
      - user_interaction_gateway
  octopus_storage:
    role: memory_vault
    default_path: /Users/dangbei/Public/octopus/octopus-storage
    reuses:
      - long_term_memory
      - asset_store
      - embeddings
      - generated_documents
      - generated_images

layers:
  world_brain:
    owner: echo_universe_engine
    runtime: octopus_agent
    purpose: Review canon, enforce rules, approve candidate events.
    writes_to:
      - outputs/world_brain
      - bible
  timeline_brain:
    owner: echo_universe_engine
    runtime: octopus_agent
    purpose: Maintain chronology from 2025 to 2200 and append approved history.
    writes_to:
      - timeline
      - outputs/timeline
  relationship_graph:
    owner: echo_universe_engine
    runtime: octopus_agent
    storage: octopus_storage
    purpose: Track trust, love, debt, fear, rivalry, betrayal, and faction links.
    writes_to:
      - relationships
      - outputs/relationships
  character_agents:
    owner: echo_universe_engine
    runtime: octopus_agent
    storage: octopus_storage
    purpose: Run Zero, Kane, Eve, Leon, Raven, Shion, Noah, and Luna as persistent personalities.
    exported_to: outputs/octopus_agents
    runtime_agents_root_env: ECHO_OCTOPUS_AGENTS_ROOT
    runtime_sync_runner: "uv run python -m echo_engine.cli export-octopus-agents --sync-octopus-runtime"
  npc_catalog:
    owner: echo_universe_engine
    runtime: octopus_agent
    entry: octopus_mobile
    purpose: Expose anchor, Realm, utility, and creator NPCs as governed social nodes.
    source: data/npcs.yaml
  economy:
    owner: echo_universe_engine
    entry: octopus_mobile
    settlement: future_mobile_relay_or_payment_gateway
    purpose: Track catalog products, wallet credits, user entitlements, and Ghost life subscriptions.
    writes_to:
      - data/economy_state.json
  story_generator:
    owner: echo_universe_engine
    runtime: octopus_agent
    purpose: Turn approved events and character conflicts into manga chapters.
    writes_to:
      - stories
      - outputs/story
  image_generator:
    owner: echo_universe_engine
    runtime: octopus_agent
    worker: asset_factory
    storage: octopus_storage
    purpose: Produce character image tasks for ComfyUI, SDXL, Flux, and later storyboard workers.
    writes_to:
      - outputs/assets
  comic_generator:
    owner: echo_universe_engine
    runtime: octopus_agent
    worker: asset_factory
    storage: octopus_storage
    purpose: Convert storyboards, prompts, and approved visual assets into comic-page candidates.
    writes_to:
      - outputs/comics

flows:
  daily_life_tick:
    schedule: "30 9 * * *"
    runner: "uv run python -m echo_engine.cli daily-life"
    status: candidate_memory
    approval: world_brain_required
  event_simulation:
    schedule: manual_or_event_triggered
    runner: "uv run python -m echo_engine.cli event"
    status: candidate_history
    approval: world_brain_required
  export_character_agents:
    schedule: after_character_or_relationship_change
    runner: "uv run python -m echo_engine.cli export-octopus-agents"
    runtime_sync_runner: "uv run python -m echo_engine.cli export-octopus-agents --sync-octopus-runtime"
    status: runtime_sync
    approval: not_required
  ecosystem_plan:
    schedule: manual
    runner: "uv run python -m echo_engine.cli octopus-ecosystem-plan"
    status: integration_report
    approval: not_required

canon_boundaries:
  candidate_until_review:
    - daily_life_tick
    - event_simulation
    - character_growth
    - relationship_changes
    - generated_story
  never_auto_promote:
    - major_character_death
    - season_secret_reveal
    - irreversible_romance
    - faction_destruction
    - god_fragment_transfer
    - omega_ghost_identity_change
