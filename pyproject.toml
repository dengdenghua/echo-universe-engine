[project]
name = "echo-universe-engine"
version = "0.1.0"
description = "Canon-first ECHO Universe worldbuilding engine."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
vector = [
    "chromadb>=0.5",
]
openai = [
    "openai>=1.50",
]
anthropic = [
    "anthropic>=0.40",
]

[project.scripts]
echo-engine = "echo_engine.cli:main"

[tool.setuptools.packages.find]
include = ["echo_engine*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# 与 echo-ai / echo-os 的 pyproject.toml 保持同一档规则集，避免同一个组织下
# 三个项目出现三套 lint 口径。
select = ["E", "F", "W", "I", "UP", "B", "N", "SIM", "RET"]
ignore = [
    # 行宽交给 formatter；本仓库尚未整体跑过 ruff format（见 README 的工程约定），
    # 先在 lint 侧放行，避免 CI 一上线就红。
    "E501",
    # FastAPI 的依赖注入写法 `x: T = Depends(...)` 是框架规定的标准形式，
    # 不是可变默认参数陷阱。本仓库 api.py 有 23 处这类注入。
    "B008",
    "N818",  # exception naming（InvariantViolation 不加 Error 后缀，与 echo-os 一致）
]

[tool.pytest.ini_options]
testpaths = ["tests"]
