#     listen 443 ssl;
#     listen [::]:443 ssl;
#     http2 on;
#     server_name universe.echo-age.com;
#     server_tokens off;
#     client_max_body_size 10m;
#
#     ssl_certificate     /etc/letsencrypt/live/universe.echo-age.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/universe.echo-age.com/privkey.pem;
#     ssl_trusted_certificate /etc/letsencrypt/live/universe.echo-age.com/chain.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_prefer_server_ciphers off;
#     ssl_session_cache shared:SSL:10m;
#     ssl_session_timeout 1d;
#     ssl_session_tickets off;
#     ssl_stapling on;
#     ssl_stapling_verify on;
#
#     add_header Strict-Transport-Security "max-age=86400" always;
#
#     # 其余 gzip / 安全头 / location 与上面 80 端口的 server 块逐条一致，
#     # 包括带 CSP 的两个 location 要各自重抄一遍通用安全头（add_header 就近替换）。
