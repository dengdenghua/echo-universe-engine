# universe.echo-age.com 反向代理到本机 uvicorn（echo_engine.api:app, 127.0.0.1:8010）。
#
# 两个前提，改动前先读：
#
# 1) Cache-Control 由应用负责，这里不要加 expires / add_header Cache-Control。
#    api.py 的 static_cache_headers 中间件按路径分级：HTML 用 no-cache（发版即生效），
#    带 ?v= 指纹的 CSS/JS 与字体用 max-age=31536000, immutable。nginx 再插一层只会打架。
#
# 2) nginx 的 add_header 不是累加而是「就近整组替换」：一旦某个 location 写了 add_header，
#    server 级的全部 add_header 对该 location 失效。所以下面带 CSP 的 location 必须把
#    通用安全响应头再抄一遍，删任何一行都会让那个路径悄悄失去保护。

server {
    listen 80;
    listen [::]:80;
    server_name universe.echo-age.com;
    server_tokens off;
    client_max_body_size 10m;

    # 应用层 GZipMiddleware 已压 ≥1KB 的响应，nginx 不会对带 Content-Encoding 的
    # 上游响应重复压缩。这里保留一份，是为了应用侧中间件被摘掉时仍有兜底。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # 通用安全响应头。HSTS 不在这里：它只应经 HTTPS 下发，见文末 TLS 块。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 前端页面的 CSP。五个前端（homepage/universe/developers/console/review）都不含
    # 内联 <script>、<style>、style="" 与 on* 处理器，也不引任何外域资源与 data: URI，
    # 因此可以上严格策略而不需要 unsafe-inline。新增内联代码前先改这里，否则线上直接白屏。
    #
    # 注意不要把这条 CSP 扩到 /docs、/redoc：FastAPI 自带的 Swagger UI 与 ReDoc
    # 依赖内联脚本和外部 CDN，套上就打不开了。
    location ~ ^/(home|universe|developers|console|review)/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;

        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 站点根路径就是首页（api.py 的 homepage_index），CSP 同上。
    location = / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;

        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# 以下 TLS 配置刻意保持注释状态：证书还没签发。
#
# ssl_certificate 指向不存在的路径会让 nginx -t 直接失败，reload 也就被拒，
# 站点会停在旧配置或起不来。顺序必须是「先签证书，再解注释」：
#
#   1. certbot certonly --webroot -w /var/www/certbot -d universe.echo-age.com
#   2. ls /etc/letsencrypt/live/universe.echo-age.com/fullchain.pem   # 确认存在
#   3. 解开下面整块注释，并把上面 server 块的 80 端口改成只保留 acme-challenge
#      与一条 return 301 https://$host$request_uri;
#   4. nginx -t && systemctl reload nginx
#
# HSTS 放在这一块而不是 HTTP 块：经明文下发没有意义，且一旦被记住就会把还没
# 上 TLS 的站点锁成无法访问。max-age 先给 1 天，确认稳定后再往上调。
# ─────────────────────────────────────────────────────────────────────────────
#
